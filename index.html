            <p style={{ color: C.text, fontSize: 13, lineHeight: 1.6, margin: "0 0 12px 0", display: "-webkit-box", WebkitLineClamp: 3, WebkitBoxOrient: "vertical", overflow: "hidden" }}>
              {problem.problemText.replace(/\\\\/g, "").replace(/\\[a-z]+/g, "").replace(/[{}^_]/g, "").slice(0, 120)}...
            </p>

            {/* 難易度 */}
            <div style={{ marginBottom: 8 }}>
              <Stars n={problem.difficulty} />
              <span style={{ color: C.textMuted, fontSize: 11, marginLeft: 8 }}>難易度 {problem.difficulty}/5</span>
            </div>

            {/* タグ */}
            <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginBottom: hasVideo ? 8 : 0 }}>
              {tags.map((tag) => (
                <TagPill key={tag.id} tag={tag} small />
              ))}
            </div>

            {/* 動画バッジ */}
            {hasVideo && (
              <div style={{ color: C.accent, fontSize: 12, fontWeight: 600 }}>
                ▶ 動画解説あり（{problem.youtubeLinks.length}本）
              </div>
            )}
          </div>
        </div>
      );
    };

    // ─── メインアプル ────────────────────────────────────────
    function App() {
      const [page, setPage] = useState("home");
      const [selectedProblem, setSelectedProblem] = useState(null);
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedTags, setSelectedTags] = useState([]);
      const [selectedUnis, setSelectedUnis] = useState([]);
      const [selectedDifficulties, setSelectedDifficulties] = useState([]);
      const [sortBy, setSortBy] = useState("difficulty-desc");
      const [blindProblem, setBlindProblem] = useState(null);
      const [blindRevealed, setBlindRevealed] = useState(false);
      const [revealStep, setRevealStep] = useState(0);
      const [showFilter, setShowFilter] = useState(false);

      // フィルタリング
      const filtered = useMemo(() => {
        let result = [...PROBLEMS];

        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          result = result.filter((p) => {
            const uni = getUni(p.universityId);
            return (
              p.problemText.toLowerCase().includes(q) ||
              uni?.name.includes(q) ||
              uni?.short.includes(q) ||
              p.tagIds.some((tid) => getTag(tid)?.name.includes(q))
            );
          });
        }

        if (selectedTags.length > 0) {
          result = result.filter((p) => selectedTags.every((tid) => p.tagIds.includes(tid)));
        }

        if (selectedUnis.length > 0) {
          result = result.filter((p) => selectedUnis.includes(p.universityId));
        }

        if (selectedDifficulties.length > 0) {
          result = result.filter((p) => selectedDifficulties.includes(p.difficulty));
        }

        result.sort((a, b) => {
          switch (sortBy) {
            case "difficulty-asc": return a.difficulty - b.difficulty;
            case "difficulty-desc": return b.difficulty - a.difficulty;
            case "year-desc": return b.year - a.year || b.questionNumber - a.questionNumber;
            case "year-asc": return a.year - b.year || a.questionNumber - b.questionNumber;
            default: return b.difficulty - a.difficulty;
          }
        });

        return result;
      }, [searchQuery, selectedTags, selectedUnis, selectedDifficulties, sortBy]);

      const toggleTag = (id) => setSelectedTags((prev) => prev.includes(id) ? prev.filter((t) => t !== id) : [...prev, id]);
      const toggleUni = (id) => setSelectedUnis((prev) => prev.includes(id) ? prev.filter((u) => u !== id) : [...prev, id]);
      const toggleDifficulty = (d) => setSelectedDifficulties((prev) => prev.includes(d) ? prev.filter((x) => x !== d) : [...prev, d]);

      const startBlind = () => {
        const pool = filtered.length > 0 ? filtered : PROBLEMS;
        const p = pool[Math.floor(Math.random() * pool.length)];
        setBlindProblem(p);
        setBlindRevealed(false);
        setRevealStep(0);
        setPage("blind");
      };

      const openDetail = (p) => {
        setSelectedProblem(p);
        setRevealStep(0);
        setPage("detail");
      };

      // ─── ナビバー ──────────────────
      const Navbar = () => (
        <div style={{ background: C.surface, borderBottom: `1px solid ${C.border}`, padding: "0 20px", position: "sticky", top: 0, zIndex: 100 }}>
          <div style={{ maxWidth: 1400, margin: "0 auto", display: "flex", alignItems: "center", height: 56, gap: 16 }}>
            {/* ロゴ */}
            <div
              onClick={() => { setPage("home"); setSelectedTags([]); setSelectedUnis([]); setSelectedDifficulties([]); setSearchQuery(""); }}
              style={{ color: C.accent, fontWeight: 800, fontSize: 20, cursor: "pointer", whiteSpace: "nowrap", letterSpacing: -0.5 }}
            >
              数超 DB
            </div>

            {/* ナビタブ */}
            <div style={{ display: "flex", gap: 4 }}>
              {[
                { label: "ホーム", key: "home" },
                { label: "ブラインド特訓", key: "blind-start" },
              ].map((item) => (
                <button
                  key={item.key}
                  onClick={() => item.key === "blind-start" ? startBlind() : setPage(item.key)}
                  style={{
                    background: page === item.key ? C.accent : "transparent",
                    color: page === item.key ? "#fff" : C.textMuted,
                    border: "none",
                    borderRadius: 8,
                    padding: "6px 14px",
                    fontSize: 13,
                    cursor: "pointer",
                    fontWeight: 600,
                    transition: "all 0.15s",
                  }}
                >
                  {item.label}
                </button>
              ))}
            </div>

            <div style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center" }}>
              {/* 検索 */}
              <input
                type="text"
                placeholder="検索..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                style={{
                  background: C.card,
                  color: C.text,
                  border: `1px solid ${C.border}`,
                  borderRadius: 8,
                  padding: "8px 12px",
                  fontSize: 13,
                  width: 200,
                  transition: "all 0.2s",
                }}
                onFocus={(e) => { e.target.style.borderColor = C.accent; e.target.style.boxShadow = `0 0 0 2px ${C.accentSoft}`; }}
                onBlur={(e) => { e.target.style.borderColor = C.border; e.target.style.boxShadow = "none"; }}
              />

              {/* フィルタボタン */}
              <button
                onClick={() => setShowFilter(!showFilter)}
                style={{
                  background: showFilter ? C.accent : C.card,
                  color: showFilter ? "#fff" : C.textMuted,
                  border: `1px solid ${showFilter ? C.accent : C.border}`,
                  borderRadius: 8,
                  padding: "8px 12px",
                  fontSize: 13,
                  cursor: "pointer",
                  fontWeight: 600,
                  transition: "all 0.15s",
                }}
              >
                フィルタ
              </button>
            </div>
          </div>
        </div>
      );

      // ─── ホームページ ──────────────────
      const HomePage = () => (
        <div style={{ background: C.bg, minHeight: "100vh", paddingTop: 16 }}>
          <Navbar />

          {/* フィルタパネル */}
          {showFilter && (
            <div style={{ background: C.surface, borderBottom: `1px solid ${C.border}`, padding: "20px", marginTop: 0 }}>
              <div style={{ maxWidth: 1400, margin: "0 auto" }}>
                {/* 大学フィルタ */}
                <div style={{ marginBottom: 20 }}>
                  <div style={{ color: C.text, fontWeight: 600, marginBottom: 8, fontSize: 13 }}>大学</div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                    {UNIVERSITIES.map((uni) => (
                      <TagPill
                        key={uni.id}
                        tag={{ ...uni, layer: 1 }}
                        selected={selectedUnis.includes(uni.id)}
                        onClick={() => toggleUni(uni.id)}
                      />
                    ))}
                  </div>
                </div>

                {/* 難易度フィルタ */}
                <div style={{ marginBottom: 20 }}>
                  <div style={{ color: C.text, fontWeight: 600, marginBottom: 8, fontSize: 13 }}>難易度</div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                    {[1, 2, 3, 4, 5].map((d) => (
                      <button
                        key={d}
                        onClick={() => toggleDifficulty(d)}
                        style={{
                          background: selectedDifficulties.includes(d) ? C.accent : C.card,
                          color: selectedDifficulties.includes(d) ? "#fff" : C.textMuted,
                          border: `1px solid ${selectedDifficulties.includes(d) ? C.accent : C.border}`,
                          borderRadius: 6,
                          padding: "6px 14px",
                          fontSize: 13,
                          cursor: "pointer",
                          fontWeight: 600,
                          transition: "all 0.15s",
                        }}
                      >
                        <Stars n={d} />
                      </button>
                    ))}
                  </div>
                </div>

                {/* タグフィルタ */}
                <div>
                  <div style={{ color: C.text, fontWeight: 600, marginBottom: 8, fontSize: 13 }}>タグ</div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                    {TAGS.slice(0, 20).map((tag) => (
                      <TagPill
                        key={tag.id}
                        tag={tag}
                        selected={selectedTags.includes(tag.id)}
                        onClick={() => toggleTag(tag.id)}
                      />
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* メインコンテンツ */}
          <div style={{ maxWidth: 1400, margin: "0 auto", padding: "20px" }}>
            {/* ソート */}
            <div style={{ marginBottom: 20, display: "flex", gap: 8, alignItems: "center" }}>
              <span style={{ color: C.textMuted, fontSize: 13 }}>ソート:</span>
              {[
                { label: "難易度（高→低）", key: "difficulty-desc" },
                { label: "難易度（低→高）", key: "difficulty-asc" },
                { label: "年度（新→旧）", key: "year-desc" },
                { label: "年度（旧→新）", key: "year-asc" },
              ].map((item) => (
                <button
                  key={item.key}
                  onClick={() => setSortBy(item.key)}
                  style={{
                    background: sortBy === item.key ? C.accent : C.card,
                    color: sortBy === item.key ? "#fff" : C.textMuted,
                    border: `1px solid ${sortBy === item.key ? C.accent : C.border}`,
                    borderRadius: 6,
                    padding: "6px 12px",
                    fontSize: 12,
                    cursor: "pointer",
                    fontWeight: 500,
                    transition: "all 0.15s",
                  }}
                >
                  {item.label}
                </button>
              ))}
            </div>

            {/+ 件数 */}
            <div style={{ color: C.textMuted, marginBottom: 16, fontSize: 12 }}>
              {filtered.length} 件の問題
            </div>

            {/* カードグリッド - FIXED minmax(280px, 1fr) */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 16, paddingBottom: 40 }}>
              {filtered.map((p) => (
                <ProblemCard key={p.id} problem={p} onClick={() => openDetail(p)} />
              ))}
            </div>
          </div>
        </div>
      );

      // ─── 詳細ページ ──────────────────
      const DetailPage = () => {
        const p = selectedProblem;
        if (!p) return null;

        const uni = getUni(p.universityId);
        const tags = p.tagIds.map(getTag).filter(Boolean);
        const totalSteps = 4;

        return (
          <div style={{ background: C.bg, minHeight: "100vh" }}>
            <Navbar />

            <div style={{ maxWidth: 1000, margin: "0 auto", padding: "40px 20px" }}>
              {/* ヘッダー */}
              <button
                onClick={() => setPage("home")}
                style={{
                  background: "transparent",
                  color: C.accent,
                  border: "none",
                  cursor: "pointer",
                  fontSize: 13,
                  marginBottom: 20,
                  fontWeight: 600,
                }}
              >
                ← ホームに戻る
              </button>

              {/* タイトル */}
              <div style={{ marginBottom: 24, borderBottom: `1px solid ${C.border}`, paddingBottom: 20 }}>
                <div style={{ color: uni?.color, fontWeight: 700, fontSize: 14, marginBottom: 8 }}>
                  {uni?.name} {p.year} {p.examType} / {p.examCategory}
                </div>
                <h1 style={{ color: C.text, fontSize: 24, fontWeight: 800, margin: "0 0 12px 0" }}>
                  {p.questionLabel}
                </h1>
                <div style={{ display: "flex", gap: 4, marginBottom: 12 }}>
                  <Stars n={p.difficulty} />
                  <span style={{ color: C.textMuted, fontSize: 12 }}>難易度 {p.difficulty}/5</span>
                </div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                  {tags.map((tag) => (
                    <TagPill key={tag.id} tag={tag} small />
                  ))}
                </div>
              </div>

              {/* 進捗インジケータ */}
              <div style={{ marginBottom: 24 }}>
                <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                  {["問題のみ", "解き方", "解法", "解答"].map((label, i) => (
                    <div
                      key={i}
                      onClick={() => setRevealStep(i)}
                      style={{
                        flex: 1,
                        height: 4,
                        background: revealStep >= i ? C.accent : C.card,
                        borderRadius: 2,
                        cursor: "pointer",
                        transition: "all 0.2s",
                      }}
                    />
                  ))}
                </div>
                <div style={{ color: C.textMuted, fontSize: 12 }}>
                  {["問題のみ", "解き方", "解法", "解答"][revealStep]}
                </div>
              </div>

              {/* コンテンツ */}
              <div style={{ background: C.card, borderRadius: 12, padding: 20, marginBottom: 24, border: `1px solid ${C.border}` }}>
                {/* 問題文 */}
                <div style={{ marginBottom: 20 }}>
                  <div style={{ color: C.textMuted, fontWeight: 600, fontSize: 12, marginBottom: 8 }}>問題文</div>
                  <p style={{ color: C.text, fontSize: 14, lineHeight: 1.8, whiteSpace: "pre-wrap" }}>
                    {p.problemText}
                  </p>
                </div>

                {/* 解き方 */}
                {revealStep >= 1 && (
                  <div style={{ marginBottom: 20, paddingTop: 20, borderTop: `1px solid ${C.border}` }}>
                    <div style={{ color: C.textMuted, fontWeight: 600, fontSize: 12, marginBottom: 8 }}>解き方（ヒント）</div>
                    <p style={{ color: C.text, fontSize: 14, lineHeight: 1.8, whiteSpace: "pre-wrap" }}>
                      {p.solutionHint}
                    </p>
                  </div>
                )}

                {/* 解法 */}
                {revealStep >= 2 && (
                  <div style={{ marginBottom: 20, paddingTop: 20, borderTop: `1px solid ${C.border}` }}>
                    <div style={{ color: C.textMuted, fontWeight: 600, fontSize: 12, marginBottom: 8 }}>解法</div>
                    <p style={{ color: C.text, fontSize: 14, lineHeight: 1.8, whiteSpace: "pre-wrap" }}>
                      {p.solutionMethod}
                    </p>
                  </div>
                )}

                {/* 解答 */}
                {revealStep >= 3 && (
                  <div style={{ paddingTop: 20, borderTop: `1px solid ${C.border}` }}>
                    <div style={{ color: C.textMuted, fontWeight: 600, fontSize: 12, marginBottom: 8 }}>解答（詳細）</div>
                    <p style={{ color: C.text, fontSize: 14, lineHeight: 1.8, whiteSpace: "pre-wrap" }}>
                      {p.solutionFull}
                    </p>
                    <div style={{ marginTop: 16, paddingTop: 16, borderTop: `1px solid ${C.border}` }}>
                      <div style={{ color: C.textMuted, fontWeight: 600, fontSize: 12, marginBottom: 8 }}>答え</div>
                      <div style={{ color: C.green, fontSize: 16, fontWeight: 700 }}>
                        {p.answerSummary}
                      </div>
                    </div>
                  </div>
                )}
              </div>

              {/* 動画リンク */}
              {p.youtubeLinks.length > 0 && (
                <div style={{ marginBottom: 24 }}>
                  <div style={{ color: C.text, fontWeight: 600, marginBottom: 12, fontSize: 14 }}>
                    動画解説
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {p.youtubeLinks.map((link, i) => (
                      <a
                        key={i}
                        href={link.url}
                        target="_blank"
                        rel="noopener noreferrer"
                        style={{
                          display: "flex",
                          alignItems: "center",
                          gap: 12,
                          background: C.card,
                          borderRadius: 8,
                          padding: 12,
                          border: `1px solid ${C.border}`,
                          color: C.accent,
                          textDecoration: "none",
                          transition: "all 0.2s",
                          cursor: "pointer",
                        }}
                        onMouseEnter={(e) => { e.currentTarget.style.background = C.cardHover; e.currentTarget.style.borderColor = C.accent; }}
                        onMouseLeave={(e) => { e.currentTarget.style.background = C.card; e.currentTarget.style.borderColor = C.border; }}
                      >
                        <span style={{ fontSize: 18 }}>▶</span>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 2 }}>
                            {link.channel} - {link.desc}
                          </div>
                          <div style={{ fontSize: 11, color: C.textMuted }}>
                            {formatTime(link.startSec)}
                          </div>
                        </div>
                        <span style={{ color: C.textMuted }}>→</span>
                      </a>
                    ))}
                  </div>
                </div>
              )}

              {/* ナビゲーション */}
              <div style={{ display: "flex", gap: 8, marginTop: 40 }}>
                <button
                  onClick={() => { const idx = PROBLEMS.findIndex((x) => x.id === p.id); if (idx > 0) setSelectedProblem(PROBLEMS[idx - 1]); }}
                  style={{
                    background: C.card,
                    color: C.textMuted,
                    border: `1px solid ${C.border}`,
                    borderRadius: 8,
                    padding: "10px 16px",
                    cursor: "pointer",
                    fontSize: 13,
                    fontWeight: 600,
                    transition: "all 0.2s",
                  }}
                >
                  ← 前の問題
                </button>
                <button
                  onClick={() => { const idx = PROBLEMS.findIndex((x) => x.id === p.id); if (idx < PROBLEMS.length - 1) setSelectedProblem(PROBLEMS[idx + 1]); }}
                  style={{
                    background: C.card,
                    color: C.textMuted,
                    border: `1px solid ${C.border}`,
                    borderRadius: 8,
                    padding: "10px 16px",
                    cursor: "pointer",
                    fontSize: 13,
                    fontWeight: 600,
                    transition: "all 0.2s",
                    marginLeft: "auto",
                  }}
                >
                  次の問題 →
                </button>
              </div>
            </div>
          </div>
        );
      };

      // ─── ブラインド特訓ページ ──────────────────
      const BlindPage = () => {
        if (!blindProblem) return null;

        const uni = getUni(blindProblem.universityId);
        const tags = blindProblem.tagIds.map(getTag).filter(Boolean);

        return (
          <div style={{ background: C.bg, minHeight: "100vh" }}>
            <Navbar />

            <div style={{ maxWidth: 1000, margin: "0 auto", padding: "40px 20px" }}>
              <button
                onClick={() => setPage("home")}
                style={{
                  background: "transparent",
                  color: C.accent,
                  border: "none",
                  cursor: "pointer",
                  fontSize: 13,
                  marginBottom: 20,
                  fontWeight: 600,
                }}
              >
                ← ホームに戻る
              </button>

              <div style={{ marginBottom: 24, borderBottom: `1px solid ${C.border}`, paddingBottom: 20 }}>
                <div style={{ color: uni?.color, fontWeight: 700, fontSize: 14, marginBottom: 8 }}>
                  ブラインド特訓
                </div>
                <div style={{ display: "flex", gap: 4, marginBottom: 12 }}>
                  <Stars n={blindProblem.difficulty} />
                  <span style={{ color: C.textMuted, fontSize: 12 }}>難易度 {blindProblem.difficulty}/5</span>
                </div>
              </div>

              <div style={{ background: C.card, borderRadius: 12, padding: 24, marginBottom: 24, border: `1px solid ${C.border}` }}>
                <p style={{ color: C.text, fontSize: 16, lineHeight: 2, whiteSpace: "pre-wrap" }}>
                  {blindProblem.problemText}
                </p>
              </div>

              <div style={{ display: "flex", gap: 12 }}>
                <button
                  onClick={() => startBlind()}
                  style={{
                    background: C.accent,
                    color: "#fff",
                    border: "none",
                    borderRadius: 8,
                    padding: "12px 20px",
                    cursor: "pointer",
                    fontSize: 13,
                    fontWeight: 600,
                    transition: "all 0.2s",
                  }}
                  onMouseEnter={(e) => { e.currentTarget.style.opacity = 0.9; }}
                  onMouseLeave={(e) => { e.currentTarget.style.opacity = 1; }}
                >
                  別の問題に変える
                </button>
                <button
                  onClick={() => openDetail(blindProblem)}
                  style={{
                    background: C.card,
                    color: C.text,
                    border: `1px solid ${C.border}`,
                    borderRadius: 8,
                    padding: "12px 20px",
                    cursor: "pointer",
                    fontSize: 13,
                    fontWeight: 600,
                    transition: "all 0.2s",
                  }}
                >
                  解答を見る
                </button>
              </div>
            </div>
          </div>
        );
      };

      // ─── ページレンダリング ──────────────────
      if (page === "detail") return <DetailPage />;
      if (page === "blind") return <BlindPage />;
      return <HomePage />;
    }

    // ─── マウント ──────────────────────────────────────────
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
